name: Agnara 0.1.0a8 Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Python 3.14 is required for agnara-cli 0.1.0a8
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
        
    - name: Run Quality Gates
      run: |
        python -m pip check
        ruff format --check .
        ruff check .
        pytest -v
        python examples/smoke_example.py
        
    - name: Build artifact
      run: |
        python -m build
        
    - name: Clean Install Verification
      run: |
        python -m venv test-env
        # Windows: .\test-env\Scripts\activate. Linux:
        source test-env/bin/activate
        pip install dist/*.whl
        agnara --version
        agnara --help
