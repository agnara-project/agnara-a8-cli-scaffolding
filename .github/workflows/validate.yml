name: Validate Agnara CLI 0.1.0a8

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        # Note: agnara-cli==0.1.0a8 metadata requires Python >= 3.14, using ignore flag
        pip install agnara-cli==0.1.0a8 --ignore-requires-python
        
    - name: Run MRE
      run: |
        python mre.py || echo "MRE failed as expected due to the SyntaxError bug."
        
    - name: Run Pytest Validation
      run: |
        pytest test_cli.py || echo "Tests will fail because the CLI cannot be imported."
