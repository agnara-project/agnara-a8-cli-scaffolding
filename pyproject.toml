[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agnara-a8-cli-scaffolding"
version = "0.1.0"
description = "Agnara 0.1.0a8 CLI & Scaffolding Validation"
authors = [
    { name = "Agnara Project", email = "dev@agnara.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "agnara==0.1.0a8",
    "agnara-cli==0.1.0a8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
    "build>=1.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py314"
