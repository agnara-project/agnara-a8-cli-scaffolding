# The project composition manifest. It records what this project contains;
# Python composition in bootstrap.py remains the runtime truth.
# `agnara apps` reads this file. `agnara app create` will update it.

[project]
name = "testing_project"
python = ">=3.14"

[defaults]
architecture = "modular-hexagonal"

[apps.testing_app]
module = "testing_project.apps.testing_app"
path = "src/testing_project/apps/testing_app"
architecture = "modular-hexagonal"
exposures = []
